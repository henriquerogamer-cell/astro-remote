name: Build Astro Remote ELF

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ui-v03
      - feat/remote-service
    paths:
      - '*.c'
      - '*.h'
      - 'Makefile'
      - '.github/workflows/build-elf.yml'
  pull_request:
    branches:
      - feat/ui-v03
    paths:
      - '*.c'
      - '*.h'
      - 'Makefile'
      - '.github/workflows/build-elf.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget unzip make

      - name: Install PS5 Payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          sudo rm -rf /opt/ps5-payload-sdk /opt/ps5-payload-sdk-staging
          sudo mkdir -p /opt/ps5-payload-sdk-staging /opt/ps5-payload-sdk
          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt/ps5-payload-sdk-staging
          SDK_ROOT="$(dirname "$(find /opt/ps5-payload-sdk-staging -type f -path '*/toolchain/prospero.mk' -print -quit)")"
          SDK_ROOT="$(dirname "$SDK_ROOT")"
          test -n "$SDK_ROOT"
          sudo cp -a "$SDK_ROOT"/. /opt/ps5-payload-sdk/
          test -f /opt/ps5-payload-sdk/toolchain/prospero.mk

      - name: Fetch ActRemoteLink NP templates
        run: |
          wget -q https://raw.githubusercontent.com/francoataffarel/ActRemoteLink/main/auth_dat.h -O auth_dat.h
          wget -q https://raw.githubusercontent.com/francoataffarel/ActRemoteLink/main/config_dat.h -O config_dat.h
          test -s auth_dat.h
          test -s config_dat.h

      - name: Build Astro Remote
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make clean
          make
          test -s astro_remote.elf
          test -s astrokill.elf
          file astro_remote.elf
          file astrokill.elf

      - name: Upload ELFs
        uses: actions/upload-artifact@v4
        with:
          name: astro_remote-elf
          path: |
            astro_remote.elf
            astrokill.elf
          if-no-files-found: error
          retention-days: 14
