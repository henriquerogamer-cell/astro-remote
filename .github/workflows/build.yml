name: Astro Remote Build and Release

on:
  push:
    branches:
      - main
      - astro-v3
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-remote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y bash clang-18 lld-18 build-essential cmake pkg-config

      - name: Install PS5 payload toolchain
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /

      - name: Build Astro Remote
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make clean
          make
          file astro_remote.elf
          sha256sum astro_remote.elf > astro_remote.elf.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro_remote
          path: |
            astro_remote.elf
            astro_remote.elf.sha256
          if-no-files-found: error

      - name: Publish automatic release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/astro-v3'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v3.0.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            astro_remote.elf \
            astro_remote.elf.sha256 \
            --target "$GITHUB_SHA" \
            --title "Astro Remote $RELEASE_TAG" \
            --generate-notes \
            --latest
